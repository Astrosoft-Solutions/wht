name: Deploy to production

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'mobile/**'
      - '**.md'
  workflow_dispatch:

# A second push waits for the running upload instead of uploading over it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      # Fails in seconds with a readable message instead of after the build with ENOTFOUND.
      - name: Check the FTP server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          set -euo pipefail
          raw="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')"
          # Hosting panels often show ftp://host, ftps://host, or host:21/path.
          host="${raw}"
          host="${host#ftp://}"
          host="${host#ftps://}"
          host="${host#ftpes://}"
          host="${host#*://}"
          host="${host%%/*}"
          host="${host%%:*}"

          if [ -z "$host" ]; then
            echo "::error::The FTP_SERVER secret is empty. Add the FTP IP/hostname from your hosting panel (not the FTP username)."
            exit 1
          fi

          echo "::add-mask::$host"

          # Hostinger-style FTP targets are often bare IPs with no reverse DNS.
          # getent fails on those even though the IP is a valid FTP server.
          if [[ "$host" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "FTP host looks like an IPv4 address; skipping reverse-DNS check."
          elif [[ "$host" =~ : ]]; then
            echo "FTP host looks like an IPv6 address; skipping reverse-DNS check."
          else
            if ! getent hosts "$host" > /dev/null; then
              echo "::error::The FTP_SERVER value does not resolve in DNS. Use the FTP IP (for example 89.x.x.x) from Hostinger → Files → FTP Accounts. Do not paste the FTP username here."
              exit 1
            fi
          fi

          echo "FTP_HOST=$host" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          coverage: none

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      # Hostinger closes FTP after 3600s; uploading vendor/ file-by-file exceeds that.
      - name: Pack vendor into one archive for FTP
        run: |
          zip -r -q vendor.zip vendor
          rm -rf vendor
          ls -lh vendor.zip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Build the admin panel into public/admin-app
        working-directory: admin
        run: |
          npm ci
          npm run build

      # Only changed files are uploaded; the action keeps a sync-state file in the server folder.
      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          # Hostinger certs rarely match a bare FTP IP; loose allows FTPS when enabled.
          security: loose
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          # Long enough for the single vendor.zip transfer on slow FTP.
          timeout: 600000
          log-level: standard
          # Custom exclude replaces the action defaults — keep git/node_modules exclusions.
          exclude: |
            .git/**
            **/.git/**
            .github/**
            **/node_modules/**
            vendor/**
            .gitattributes
            .editorconfig
            .env
            .env.*
            .phpunit.result.cache
            phpunit.xml
            README.md
            admin/**
            mobile/**
            tests/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/framework/testing/**

      - name: Run migrations and unpack vendor.zip
        if: env.DEPLOY_TOKEN != '' && env.APP_URL != ''
        run: |
          curl --fail-with-body --silent --show-error --max-time 600 \
            -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            "${APP_URL%/}/api/deploy/hook"

      - name: Warn when the deploy hook cannot unpack vendor.zip
        if: env.DEPLOY_TOKEN == '' || env.APP_URL == ''
        run: |
          echo "::warning::vendor.zip was uploaded, but DEPLOY_TOKEN and/or APP_URL secrets are missing. Set both so /api/deploy/hook can unpack vendor on the server. Until then the previous vendor/ folder on the host is left as-is."
